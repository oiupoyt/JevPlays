pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'fabric-loom' version '1.18.2' apply false
}

rootProject.name = 'JevPlays'
include 'core'
include 'adapter-1_21_11'
include 'adapter-26_1'
include 'adapter-26_2'
